plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Die Minecraft-Version gehoert in den Dateinamen: pro Version gibt es ein
// eigenes Jar, und niemand soll raten muessen, welches er braucht.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom fuegt die Minecraft-/Fabric-Repositories selbst hinzu.
}

loom {
	runs {
		client {
			// Eigener Ordner je Minecraft-Version. Sonst versucht ein
			// aelterer Client, eine mit einer neueren Version erstellte Welt
			// zu oeffnen - das verweigert Minecraft, und man sucht lange nach
			// dem Grund.
			runDir 'run-' + project.minecraft_version

			// Selbsttests, beide nur auf Zuruf:
			//   ./gradlew runClient -Pselftest -Pworld="New World"
			//   ./gradlew runClient -Ptriggertest -Pworld="New World"
			if (project.hasProperty('selftest')) {
				property 'popeffects.selftest', 'true'
			}

			if (project.hasProperty('triggertest')) {
				property 'popeffects.triggertest', 'true'
			}

			if (project.hasProperty('world')) {
				programArgs '--quickPlaySingleplayer', project.property('world').toString()
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Kein mappings-Eintrag und kein modImplementation: Minecraft 26.x wird
	// unobfuskiert ausgeliefert. Die Klassen im Jar heissen bereits
	// Minecraft, LivingEntity und GuiGraphics, es gibt also nichts
	// umzubenennen - weder beim Bauen noch bei den Abhaengigkeiten.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'github_user', project.github_user
	inputs.property 'github_repo', project.github_repo

	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version,
				'github_user': inputs.properties.github_user,
				'github_repo': inputs.properties.github_repo
	}
}

// Gleiche Eingabe soll das gleiche Jar ergeben - erleichtert das Vergleichen
// von Builds und vermeidet unnoetige Unterschiede zwischen Rechner und CI.
tasks.withType(AbstractArchiveTask).configureEach {
	it.preserveFileTimestamps = false
	it.reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 26.x setzt Java 25 voraus.
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {

	withSourcesJar()
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
