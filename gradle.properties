# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft / Fabric
#
# Fuer 26.x gibt es keine Yarn-Mappings mehr - Fabric ist dort auf die
# offiziellen Mojang-Namen umgestiegen. Deshalb steht hier kein
# yarn_mappings-Eintrag; die Mappings holt build.gradle direkt bei Mojang.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod
mod_version=2.0.0
maven_group=com.popeffects
archives_base_name=popeffects

github_user=Sercigamer
github_repo=popeffects

# Dependencies
fabric_version=0.157.0+26.2

# Minecraft 26.x ist unobfuskiert - es gibt nichts umzubenennen. Das
# Umschreiben der Abhaengigkeiten spart man sich also, es scheitert sonst
# beim Quelltext-Jar von Fabric API.
fabric.loom.disableRemappedVariants=true
