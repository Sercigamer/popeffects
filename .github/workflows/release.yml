name: Release

# Baut die Mod und veroeffentlicht ein GitHub-Release, sobald ein Tag wie
# v2.0.0 gepusht wird. Der Release-Text kommt aus dem passenden Abschnitt in
# CHANGELOG.md - so bleiben Changelog und Release automatisch deckungsgleich.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag gegen mod_version pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu mod_version=$VERSION"
            exit 1
          fi
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Release-Jar einsammeln
        run: |
          mkdir -p release
          cp build/libs/*.jar release/
          # Das Sources-Jar gehoert nicht in den mods-Ordner - sonst laedt es
          # jemand versehentlich statt der Mod herunter.
          rm -f release/*-sources.jar
          ls -l release

      - name: Release-Text aus CHANGELOG und Vorlage bauen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Bewusst ohne Regex: die eckigen Klammern der Ueberschrift muessten
          # sonst doppelt escaped werden, was leicht still danebengeht.
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found = 1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found { print }
          ' CHANGELOG.md > section.md

          if [ ! -s section.md ]; then
            echo "::error::Kein CHANGELOG-Abschnitt fuer Version $VERSION gefunden."
            exit 1
          fi

          sed -e '/{{CHANGELOG}}/r section.md' -e '/{{CHANGELOG}}/d' \
            .github/release-template.md > release-body.md

          sed -i \
            -e "s|{{VERSION}}|$VERSION|g" \
            -e "s|{{REPO_FULL}}|$GITHUB_REPOSITORY|g" \
            release-body.md

          if grep -q '{{' release-body.md; then
            echo "::error::Im Release-Text ist ein Platzhalter uebrig geblieben."
            grep -n '{{' release-body.md
            exit 1
          fi

          cat release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: PopEffects ${{ env.MOD_VERSION }}
          body_path: release-body.md
          files: release/*.jar
          fail_on_unmatched_files: true

      # Der Upload zu Modrinth laeuft nur, wenn das Geheimnis MODRINTH_TOKEN
      # hinterlegt ist. Ohne Token wird der Schritt uebersprungen statt den
      # ganzen Release scheitern zu lassen - wer das Repo forkt, soll nicht
      # ueber eine fehlende Zugangsberechtigung stolpern.
      - name: Modrinth-Token vorhanden?
        id: modrinth
        run: |
          if [ -n "${{ secrets.MODRINTH_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MODRINTH_TOKEN ist nicht gesetzt - Upload zu Modrinth wird uebersprungen."
          fi

      - name: Nach Modrinth hochladen
        if: steps.modrinth.outputs.ready == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release/*.jar
          name: PopEffects ${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}+26.2
          version-type: release
          changelog-file: release-body.md
          loaders: fabric
          game-versions: "26.2"
          java: 25
          dependencies: |
            fabric-api(required)
