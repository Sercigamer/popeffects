name: Release

# Baut die Mod fuer jede unterstuetzte Minecraft-Version und veroeffentlicht
# ein GitHub-Release mit allen Jars, sobald ein Tag wie v1.3.1 gepusht wird.
# Der Release-Text kommt aus dem passenden Abschnitt in CHANGELOG.md - so
# bleiben Changelog und Release automatisch deckungsgleich.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.10"
            yarn: "1.21.10+build.3"
            fabric_api: "0.138.4+1.21.10"
          - minecraft: "1.21.11"
            yarn: "1.21.11+build.6"
            fabric_api: "0.141.6+1.21.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag gegen mod_version pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu mod_version=$VERSION"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fuer Minecraft ${{ matrix.minecraft }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace \
            -Pminecraft_version=${{ matrix.minecraft }} \
            -Pyarn_mappings=${{ matrix.yarn }} \
            -Pfabric_version=${{ matrix.fabric_api }}

      - name: Release-Jar einsammeln
        run: |
          mkdir -p release
          cp build/libs/*.jar release/
          # Das Sources-Jar gehoert nicht in den mods-Ordner - sonst laedt es
          # jemand versehentlich statt der Mod herunter.
          rm -f release/*-sources.jar
          ls -l release

      - name: Jar weiterreichen
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.minecraft }}
          path: release/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Alle Jars einsammeln
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: release

      - name: Release-Text aus CHANGELOG und Vorlage bauen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"

          # Bewusst ohne Regex: die eckigen Klammern der Ueberschrift muessten
          # sonst doppelt escaped werden, was leicht still danebengeht.
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found = 1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found { print }
          ' CHANGELOG.md > section.md

          if [ ! -s section.md ]; then
            echo "::error::Kein CHANGELOG-Abschnitt fuer Version $VERSION gefunden."
            exit 1
          fi

          # Erst den Changelog-Block einsetzen, dann die einfachen Platzhalter.
          # Der Text steht in .github/release-template.md - dort laesst er sich
          # gefahrlos bearbeiten, ohne Shell-Escaping.
          sed -e '/{{CHANGELOG}}/r section.md' -e '/{{CHANGELOG}}/d' \
            .github/release-template.md > release-body.md

          sed -i \
            -e "s|{{VERSION}}|$VERSION|g" \
            -e "s|{{REPO_FULL}}|$GITHUB_REPOSITORY|g" \
            release-body.md

          if grep -q '{{' release-body.md; then
            echo "::error::Im Release-Text ist ein Platzhalter uebrig geblieben."
            grep -n '{{' release-body.md
            exit 1
          fi

          echo "Diese Jars gehen mit:"
          ls -l release
          cat release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: PopEffects ${{ env.MOD_VERSION }}
          body_path: release-body.md
          files: release/*.jar
          fail_on_unmatched_files: true
