name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        # Das chmod ist Absicht: wird gradlew aus Windows heraus neu
        # hinzugefuegt, fehlt im Git-Index das Ausfuehrbar-Bit und der Runner
        # bricht mit "Permission denied" ab, bevor Gradle ueberhaupt startet.
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: popeffects-dev-build
          path: build/libs/*.jar
          if-no-files-found: error
